<div class="main-container">
  <header class="header">
    <h2>Gerenciamento de Produtos</h2>
    <span class="badge">.NET 8 + Angular</span>
  </header>

  <div class="content-grid">
    <!-- Coluna da Esquerda: Ações (Buscar e Adicionar) -->
    <div class="sidebar-actions">
      <!-- Novo Produto -->
      <section class="card">
        <h3>Novo Produto</h3>
        <div class="form-group">
          <input type="text" [(ngModel)]="novoNome" placeholder="Nome do produto" class="form-control">
          <input type="number" [(ngModel)]="novoPreco" placeholder="Preço (R$)" class="form-control">
          <button type="button" (click)="criarProduto()" class="btn btn-primary">Adicionar Produto</button>
        </div>
      </section>

      <!-- Busca por ID -->
      <section class="card">
        <h3>Pesquisar por ID</h3>
        <div class="form-group">
          <div class="search-box">
            <input type="number" [(ngModel)]="idBusca" placeholder="Digite o ID..." class="form-control">
            <button type="button" (click)="buscarPorId()" class="btn btn-secondary">Buscar</button>
          </div>
          <div *ngIf="produtoBusca" class="search-result">
            <p><strong>ID:</strong> {{ produtoBusca.id }}</p>
            <p><strong>Nome:</strong> {{ produtoBusca.nome }}</p>
            <p><strong>Preço:</strong> R$ {{ produtoBusca.preco }}</p>
          </div>
        </div>
      </section>
    </div>

    <!-- Coluna da Direita: Tabela de Produtos -->
    <div class="main-content">
      <section class="card">
        <h3>Lista de Produtos Cadastrados</h3>
        <div class="table-responsive">
          <table class="modern-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let p of produtos">
                <td>#{{ p.id }}</td>
                <td>
                  <span *ngIf="editandoId !== p.id" class="text-bold">{{ p.nome }}</span>
                  <input *ngIf="editandoId === p.id" [(ngModel)]="editNome" type="text" class="form-control-sm">
                </td>
                <td>
                  <span *ngIf="editandoId !== p.id">R$ {{ p.preco }}</span>
                  <input *ngIf="editandoId === p.id" [(ngModel)]="editPreco" type="number" class="form-control-sm">
                </td>
                <td class="text-right">
                  <ng-container *ngIf="editandoId !== p.id">
                    <button type="button" (click)="iniciarEdicao(p)" class="btn-action btn-edit">Editar</button>
                    <button type="button" (click)="remover(p.id)" class="btn-action btn-delete">Remover</button>
                  </ng-container>
                  <ng-container *ngIf="editandoId === p.id">
                    <button type="button" (click)="salvarEdicao(p.id)" class="btn-action btn-save">Salvar</button>
                    <button type="button" (click)="cancelarEdicao()" class="btn-action btn-cancel">Cancelar</button>
                  </ng-container>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>
